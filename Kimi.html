        }

        case 'pinwheel': {                     // charge, telegraph, dash
          this.rot += this.spin * dt;
          this.phaseT -= dt;
          if (this.phase === 'wait') {
            this.vx *= 1 / (1 + 8 * dt); this.vy *= 1 / (1 + 8 * dt);
            this.aimA = Math.atan2(dy, dx);
            if (this.phaseT <= 0) {
              this.phase = 'dash'; this.phaseT = 0.42;
              this.vx = Math.cos(this.aimA) * d.maxV;
              this.vy = Math.sin(this.aimA) * d.maxV;
            }
          } else if (this.phaseT <= 0) {
            this.phase = 'wait'; this.phaseT = U.rand(0.6, 1.0);
            this.vx *= 0.25; this.vy *= 0.25;
          }
          break;
        }

        case 'well': {                         // gravity source
          this.wander += U.rand(-1, 1) * dt * 2;
          this.vx = U.lerp(this.vx, Math.cos(this.wander) * d.maxV, dt);
          this.vy = U.lerp(this.vy, Math.sin(this.wander) * d.maxV, dt);
          this.rot += this.spin * dt;
          this.fireT -= dt;
          if (this.fireT <= 0) this.die(false, g);   // destabilize
          if (((this.t * 2) | 0) !== (((this.t - dt) * 2) | 0)) A.wellPulse();
          break;
        }
      }

      if (d.acc) { this.vx += ax * dt; this.vy += ay * dt; }
      const mv = Math.hypot(this.vx, this.vy), cap = d.maxV;
      if (mv > cap) { this.vx = this.vx / mv * cap; this.vy = this.vy / mv * cap; }
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.confine(g);
    }

    confine(g, bounce) {
      const W = NV.CONFIG.WORLD_W, H = NV.CONFIG.WORLD_H, m = this.r + 6;
      if (bounce || this.type === 'drifter' || this.type === 'well') {
        if (this.x < m) { this.x = m; this.vx = Math.abs(this.vx); }
        else if (this.x > W - m) { this.x = W - m; this.vx = -Math.abs(this.vx); }
        if (this.y < m) { this.y = m; this.vy = Math.abs(this.vy); }
        else if (this.y > H - m) { this.y = H - m; this.vy = -Math.abs(this.vy); }
      } else {
        this.x = U.clamp(this.x, m, W - m);
        this.y = U.clamp(this.y, m, H - m);
      }
    }

    hurt(dmg, dirx, diry, g) {
      this.hp -= dmg; this.flash = 1;
      const kb = this.type === 'well' ? 10 : 70;   // wells are heavy
      if (dirx) { this.vx += dirx * kb; this.vy += diry * kb; }
      if (this.hp <= 0) { this.die(true, g); return true; }
      A.enemyHit();
      Fx.dot(this.x, this.y, this.def.color, { sp: 120, life: 0.25, size: 2 });
      return false;
    }

    die(byPlayer, g) {
      if (this.dead) return;
      this.dead = true;
      const d = this.def, big = this.r >= 16 ? 1 : 0.55;
      Fx.shatter(this.worldShape(), d.color, this.x, this.y);
      Fx.burst(this.x, this.y, d.color, 8 + ((this.r / 2) | 0), 300);
      Fx.ring(this.x, this.y, d.color, this.r * 0.5, 620, 0.35);
      Grid.pulse(this.x, this.y, 130 + this.r * 3, 90 + this.r * 4);
      g.addTrauma(0.06 + this.r * 0.004);

      if (byPlayer) {
        g.score += d.score * g.mult;
        g.kills++;
        if (d.score >= 100) Fx.text(this.x, this.y, '+' + (d.score * g.mult), d.color, 14);
        g.freeze = Math.max(g.freeze, d.score >= 130 ? 0.05 : 0.025);   // hit-stop
        A.enemyDie(big);
        g.dropLoot(this);
      } else {
        A.explosion(0.7);
      }

      if (this.type === 'splitter') {
        for (let i = 0; i < 3; i++) {
          const a = (i / 3) * U.TAU + U.rand(0.5);
          g.enemies.push(new Enemy('mini',
            this.x + Math.cos(a) * 14, this.y + Math.sin(a) * 14,
            { instant: true, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220 }));
        }
      }

      if (this.type === 'well') {
        A.explosion(1.6);
        Fx.ring(this.x, this.y, '#ffffff', this.r, 1400, 0.6, 3);
        Grid.pulse(this.x, this.y, 480, -620);   // implosion ripple
        g.addTrauma(0.5);
        g.freeze = 0.09;
        if (byPlayer) {
          g.spawnPickup(U.pick(['triple', 'rapid', 'shield', 'bomb']), this.x, this.y);
        } else {                                   // destabilized: bullet ring
          for (let i = 0; i < 10; i++) g.spawnEBullet(this.x, this.y, (i / 10) * U.TAU, 300);
          Fx.ring(this.x, this.y, PAL.ebullet, this.r, 900, 0.5, 3);
        }
      }
    }

    draw(c, g) {
      const d = this.def;
      let alpha = 1, scale = 1;

      if (this.state === 'spawn') {
        const k = U.easeOut(U.clamp(this.st / 0.55, 0, 1));
        alpha = 0.15 + 0.85 * k; scale = 0.25 + 0.75 * k;
        Render.neonCircle(this.x, this.y, this.r * (2.2 - 1.2 * k), d.color, 1.5, (1 - k) * 0.7);
      }

      const col = this.flash > 0.05 ? '#ffffff' : d.color;

      /* Telegraphs. */
      if (this.type === 'sentinel' && this.telegraph > 0 && g.player) {
        const aim = Math.atan2(g.player.y - this.y, g.player.x - this.x);
        Render.drawGlow(this.x, this.y, this.r * (2 + this.telegraph), d.color, this.telegraph * 0.5);
        c.save();
        c.globalAlpha = this.telegraph * 0.55;
        c.strokeStyle = PAL.ebullet; c.lineWidth = 1.3;
        c.setLineDash([5, 9]);
        c.beginPath();
        c.moveTo(this.x + Math.cos(aim) * this.r, this.y + Math.sin(aim) * this.r);
        c.lineTo(this.x + Math.cos(aim) * 150, this.y + Math.sin(aim) * 150);
        c.stroke();
        c.restore();
      }
      if (this.type === 'pinwheel' && this.phase === 'wait' && this.state === 'active') {
        c.save();
        c.globalAlpha = 0.22 + 0.18 * Math.sin(this.t * 14);
        c.strokeStyle = d.color; c.lineWidth = 1.2;
        c.setLineDash([6, 8]);
        c.beginPath();
        c.moveTo(this.x, this.y);
        c.lineTo(this.x + Math.cos(this.aimA) * 120, this.y + Math.sin(this.aimA) * 120);
        c.stroke();
        c.restore();
      }

      if (this.type === 'well') {
        const pulse = 1 + Math.sin(this.t * 6) * 0.05;
        Render.drawGlow(this.x, this.y, this.r * 3.2 * pulse, d.color, 0.5 * alpha);
        Render.neonCircle(this.x, this.y, this.r * pulse, col, 2, alpha);
        Render.neonCircle(this.x, this.y, this.r * 0.55, col, 1.5, alpha * 0.8);
        c.globalAlpha = alpha; c.fillStyle = '#ffffff';
        for (let i = 0; i < 3; i++) {
          const a = this.t * 2.2 + (i / 3) * U.TAU;
          c.beginPath();
          c.arc(this.x + Math.cos(a) * this.r * 1.6, this.y + Math.sin(a) * this.r * 1.6, 2, 0, U.TAU);
          c.fill();
        }
        c.globalAlpha = 1;
        return;
      }

      const cs = Math.cos(this.rot), sn = Math.sin(this.rot), rr = this.r * scale;
      const pts = d.shape.map(p => [this.x + (p[0] * cs - p[1] * sn) * rr, this.y + (p[0] * sn + p[1] * cs) * rr]);
      Render.drawGlow(this.x, this.y, this.r * 2.4, d.color, 0.22 * alpha);
      Render.neon(pts, col, 2, alpha, true);
    }
  }

  /* ------------------------------------------------------------------ */
  /* Pickups                                                              */
  /* ------------------------------------------------------------------ */
  const PICKUPS = {
    gem:    { color: '#5cff8f', r: 8,  label: '' },
    triple: { color: '#ffd23c', r: 11, label: 'T' },
    rapid:  { color: '#ff5cf0', r: 11, label: 'R' },
    shield: { color: '#45b0ff', r: 11, label: 'S' },
    life:   { color: '#ffffff', r: 11, label: '+' },
    bomb:   { color: '#ffb020', r: 11, label: 'B' },
  };

  class Pickup {
    constructor(kind, x, y) {
      this.kind = kind; this.x = x; this.y = y;
      this.vx = U.rand(-40, 40); this.vy = U.rand(-40, 40);
      this.t = U.rand(10); this.life = 9; this.dead = false;
      this.r = PICKUPS[kind].r;
    }

    update(dt, g) {
      this.t += dt; this.life -= dt;
      if (this.life <= 0) { this.dead = true; return; }
      const p = g.player;
      if (p && !p.dead) {
        const dx = p.x - this.x, dy = p.y - this.y, d = Math.hypot(dx, dy);
        if (d < NV.TUNE.magnetDist && d > 0.1) {
          this.vx += dx / d * 1800 * dt;
          this.vy += dy / d * 1800 * dt;
        }
        if (d < p.r + this.r + 4) { this.collect(g); return; }
      }
      const k = 1 / (1 + 3.2 * dt);
      this.vx *= k; this.vy *= k;
      this.x += this.vx * dt; this.y += this.vy * dt;
      this.x = U.clamp(this.x, 14, NV.CONFIG.WORLD_W - 14);
      this.y = U.clamp(this.y, 14, NV.CONFIG.WORLD_H - 14);
    }

    collect(g) {
      this.dead = true;
      const k = PICKUPS[this.kind], p = g.player;
      if (this.kind === 'gem') {
        if (g.mult < NV.TUNE.multiplierMax) {
          g.mult++; g.multPulse = 1;
          Fx.text(this.x, this.y, 'x' + g.mult, k.color, 20);
          A.multUp(g.mult);
        } else {
          g.score += 100;
          Fx.text(this.x, this.y, '+100', k.color, 16);
          A.pickup();
        }
      } else if (this.kind === 'triple') {
        p.powerTriple = NV.TUNE.powerupTime;
        Fx.text(this.x, this.y, 'TRIPLE SHOT', k.color, 16); A.pickup();
      } else if (this.kind === 'rapid') {
        p.powerRapid = NV.TUNE.powerupTime;
        Fx.text(this.x, this.y, 'RAPID FIRE', k.color, 16); A.pickup();
      } else if (this.kind === 'shield') {
        p.shield = true;
        Fx.text(this.x, this.y, 'SHIELD', k.color, 16); A.pickup();
      } else if (this.kind === 'life') {
        if (p.lives < NV.TUNE.player.maxLives) p.lives++;
        Fx.text(this.x, this.y, 'EXTRA LIFE', k.color, 16); A.pickup();
      } else if (this.kind === 'bomb') {
        if (g.bombs < NV.TUNE.player.maxBombs) g.bombs++;
        Fx.text(this.x, this.y, '+BOMB', k.color, 16); A.pickup();
      }
      Fx.ring(this.x, this.y, k.color, 4, 380, 0.3);
    }

    draw(c) {
      const k = PICKUPS[this.kind];
      const blink = this.life < 2.5 ? (Math.sin(this.t * 18) > 0 ? 1 : 0.25) : 1;
      const r = this.r * (1 + Math.sin(this.t * 5) * 0.12);
      if (this.kind === 'gem') {
        Render.neonPoly(this.x, this.y, r, 4, this.t * 1.5, k.color, 2, blink);
        Render.drawGlow(this.x, this.y, r * 2.2, k.color, 0.35 * blink);
      } else {
        Render.neonCircle(this.x, this.y, r, k.color, 2, blink);
        Render.neonPoly(this.x, this.y, r * 0.45, 4, Math.PI / 4, k.color, 1.2, blink);
        c.font = '800 11px system-ui, sans-serif';
        c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillStyle = '#ffffff'; c.globalAlpha = blink;
        c.fillText(k.label, this.x, this.y + 0.5);
        c.globalAlpha = 1; c.textAlign = 'left';
      }
    }
  }

  /* ------------------------------------------------------------------ */
  /* Player                                                               */
  /* ------------------------------------------------------------------ */
  const SHIP = [[1.45, 0], [-0.95, 0.8], [-0.45, 0], [-0.95, -0.8]];

  function drawShip(x, y, a, color, alpha, scale, c) {
    const cs = Math.cos(a), sn = Math.sin(a), r = T.radius * 1.6 * scale;
    const pts = SHIP.map(p => [x + (p[0] * cs - p[1] * sn) * r, y + (p[0] * sn + p[1] * cs) * r]);
    Render.neon(pts, PAL.player, 3.2, alpha * 0.5, true);   // glow pass
    Render.neon(pts, color, 1.6, alpha, true);              // bright core
  }

  class Player {
    constructor() {
      this.x = NV.CONFIG.WORLD_W / 2;
      this.y = NV.CONFIG.WORLD_H / 2;
      this.vx = 0; this.vy = 0;
      this.r = T.radius;
      this.angle = -Math.PI / 2; this.aim = -Math.PI / 2;
      this.lives = T.startLives;
      this.dead = false; this.deadT = 0;
      this.invuln = 2;
      this.fireCd = 0; this.dashCd = 0; this.dashT = 0; this.dashA = 0;
      this.ghosts = []; this.ghostT = 0;
      this.powerTriple = 0; this.powerRapid = 0; this.shield = false;
      this.thrust = 0;
    }

    update(dt, g) {
      if (this.dead) {
        this.deadT += dt;
        if (this.lives >= 0 && this.deadT > 1.1 && g.state === 'playing') this.respawn(g);
        return;
      }
      const I = NV.Input;
      this.invuln = Math.max(0, this.invuln - dt);
      this.fireCd -= dt; this.dashCd -= dt;
      this.powerTriple = Math.max(0, this.powerTriple - dt);
      this.powerRapid = Math.max(0, this.powerRapid - dt);

      const mv = I.moveAxis();
      this.thrust = Math.hypot(mv.x, mv.y);

      if (this.dashT > 0) {
        /* Blink: fixed velocity, invulnerable, leaves afterimages. */
        this.dashT -= dt;
        this.vx = Math.cos(this.dashA) * T.dashSpeed;
        this.vy = Math.sin(this.dashA) * T.dashSpeed;
        this.ghostT -= dt;
        if (this.ghostT <= 0) {
          this.ghosts.push({ x: this.x, y: this.y, angle: this.angle, life: 0.3, dead: false });
          this.ghostT = 0.02;
        }
        if (this.dashT <= 0) { this.vx *= 0.3; this.vy *= 0.3; }
      } else {
        const wantDash = I.consume('ShiftLeft') || I.consume('ShiftRight') ||
          I.mouse.rEdge || I.padEdge[5] || I.padEdge[1] || I.padEdge[6];
        if (wantDash && this.dashCd <= 0) {
          let ax = mv.x, ay = mv.y;
          if (Math.hypot(ax, ay) < 0.2) { ax = Math.cos(this.aim); ay = Math.sin(this.aim); }
          this.dashA = Math.atan2(ay, ax);
          this.dashT = T.dashTime; this.dashCd = T.dashCd;
          this.invuln = Math.max(this.invuln, T.dashTime + 0.08);
          A.dash();
          Grid.pulse(this.x, this.y, 140, -160);
          Fx.burst(this.x, this.y, PAL.player, 10, 220, { life: 0.35 });
        }
        this.vx += mv.x * T.accel * dt;
        this.vy += mv.y * T.accel * dt;
        const k = 1 / (1 + T.drag * dt);
        this.vx *= k; this.vy *= k;
      }

      const sp = Math.hypot(this.vx, this.vy);
      if (sp > T.maxSpeed && this.dashT <= 0) {
        this.vx = this.vx / sp * T.maxSpeed;
        this.vy = this.vy / sp * T.maxSpeed;
      }
      this.x += this.vx * dt; this.y += this.vy * dt;
      const W = NV.CONFIG.WORLD_W, H = NV.CONFIG.WORLD_H, m = this.r + 4;
      this.x = U.clamp(this.x, m, W - m);
      this.y = U.clamp(this.y, m, H - m);

      /* Hull faces the aim direction (mouse / right stick). */
      this.aim = I.aimAngle(this.x, this.y);
      let da = this.aim - this.angle;
      while (da > Math.PI) da -= U.TAU;
      while (da < -Math.PI) da += U.TAU;
      this.angle += da * Math.min(1, dt * 22);

      if (I.firing() && this.fireCd <= 0) this.fire(g);

      /* Engine exhaust. */
      if ((this.thrust > 0.1 || this.dashT > 0) && Math.random() < 0.85) {
        const bx = this.x - Math.cos(this.angle) * this.r * 1.5;
        const by = this.y - Math.sin(this.angle) * this.r * 1.5;
        Fx.dot(bx, by, Math.random() < 0.3 ? '#ffffff' : '#39c8ff',
          { sp: U.rand(40, 150), life: U.rand(0.2, 0.45), size: U.rand(1.5, 2.6) });
      }

      for (const gh of this.ghosts) { gh.life -= dt; gh.dead = gh.life <= 0; }
      U.compact(this.ghosts);
    }

    fire(g) {
      this.fireCd = this.powerRapid > 0 ? T.fireCdRapid : T.fireCd;
      const spread = this.powerTriple > 0 ? [-0.14, 0, 0.14] : [0];
      for (const s of spread) {
        const a = this.aim + s + U.rand(-0.012, 0.012);
        g.bullets.push({
          x: this.x + Math.cos(a) * 16, y: this.y + Math.sin(a) * 16,
          px: this.x, py: this.y,
          vx: Math.cos(a) * T.bulletSpeed, vy: Math.sin(a) * T.bulletSpeed,
          life: T.bulletLife, r: 3.6, dead: false,
        });
      }
      g.shots += spread.length;
      A.shoot();
      const nx = this.x + Math.cos(this.aim) * 18, ny = this.y + Math.sin(this.aim) * 18;
      Grid.pulse(nx, ny, 60, 26);
      Fx.spark(nx, ny, '#ffffff', this.aim, { sp: 60, life: 0.08, size: 3 });
      this.vx -= Math.cos(this.aim) * 14;   // tiny recoil
      this.vy -= Math.sin(this.aim) * 14;
    }

    takeHit(g) {
      if (this.dead || this.invuln > 0) return;

      if (this.shield) {
        this.shield = false; this.invuln = T.hitInvuln;
        A.explosion(0.5);
        Fx.ring(this.x, this.y, '#45b0ff', this.r, 700, 0.4, 3);
        Fx.burst(this.x, this.y, '#45b0ff', 26, 340);
        g.addTrauma(0.35);
        Grid.pulse(this.x, this.y, 200, 260);
        return;
      }

      this.lives--;
      this.dead = true; this.deadT = 0;
      g.mult = 1;
      A.playerDeath();
      Fx.burst(this.x, this.y, '#ffffff', 50, 520);
      Fx.burst(this.x, this.y, PAL.player, 40, 380);
      Fx.ring(this.x, this.y, '#ffffff', 10, 1200, 0.7, 3);
      Fx.ring(this.x, this.y, PAL.player, 10, 800, 0.9, 2);
      /* The ship itself shatters like the enemies do. */
      const cs = Math.cos(this.angle), sn = Math.sin(this.angle), r = this.r * 1.6;
      Fx.shatter(SHIP.map(p => [this.x + (p[0] * cs - p[1] * sn) * r, this.y + (p[0] * sn + p[1] * cs) * r]),
        PAL.player, this.x, this.y);
      Grid.pulse(this.x, this.y, 420, 700);
      g.addTrauma(0.85);
      g.slowmo(0.25, 0.9);
      g.flash = 0.7; g.flashColor = '#ff5a5a';

      /* Clear the immediate area so respawn is not a coin flip. */
      for (const e of g.enemies)
        if (!e.dead && e.state === 'active' && U.dist2(e.x, e.y, this.x, this.y) < 260 * 260)
          e.die(false, g);
      for (const b of g.ebullets) b.dead = true;

      if (this.lives < 0) g.gameOver();
    }

    respawn(g) {
      this.dead = false; this.deadT = 0;
      this.x = NV.CONFIG.WORLD_W / 2;
      this.y = NV.CONFIG.WORLD_H / 2;
      this.vx = this.vy = 0;
      this.invuln = T.respawnInvuln;
      this.dashT = 0; this.dashCd = 0;
      Fx.ring(this.x, this.y, PAL.player, 8, 900, 0.6, 2);
    }

    draw(c, g) {
      for (const gh of this.ghosts) {
        const a = U.clamp(gh.life / 0.3, 0, 1);
        drawShip(gh.x, gh.y, gh.angle, PAL.player, a * 0.5, 1.4, c);
      }
      if (this.dead) return;

      const alpha = this.invuln > 0 ? (Math.sin(this.invuln * 24) > 0 ? 1 : 0.3) : 1;

      /* Engine flame. */
      if (this.thrust > 0.1 || this.dashT > 0) {
        const flick = 0.7 + Math.random() * 0.6;
        const tail = [[-0.5, 0], [-0.5 - 0.9 * flick, 0.32], [-0.5 - 1.3 * flick, 0], [-0.5 - 0.9 * flick, -0.32]];
        const cs = Math.cos(this.angle), sn = Math.sin(this.angle), r = this.r;
        Render.neon(tail.map(p => [this.x + (p[0] * cs - p[1] * sn) * r, this.y + (p[0] * sn + p[1] * cs) * r]),
          '#ff9a3c', 1.6, alpha * 0.9, false);
      }

      Render.drawGlow(this.x, this.y, this.r * 3, PAL.player, 0.35 * alpha);
      drawShip(this.x, this.y, this.angle, '#ffffff', alpha, 1, c);

      if (this.shield)
        Render.neonCircle(this.x, this.y, this.r + 9, '#45b0ff', 1.5, 0.5 + 0.3 * Math.sin(g.time * 6));
    }
  }

  window.NV.Entities = { Enemy, Pickup, Player, DEFS, PICKUPS };
})();

</script>
<script>
/* ==== inlined: js/waves.js ==== */
'use strict';
/* ============================================================
   NEON VOID — waves.js
   Wave director: each wave gets a "threat budget" that grows
   with the wave number; enemies are drawn from an unlocking
   pool and trickled into the arena in spawn clusters.
   ============================================================ */
(function () {
  const U = NV.U;

  /* Types available at (wave >= index). Wave 1 = seekers only. */
  const UNLOCKS = [
    [], ['weaver'], ['drifter', 'splitter'], ['dodger'],
    ['sentinel'], ['pinwheel'], ['well'],
  ];

  const Waves = {
    wave: 0, queue: [], spawnT: 0, interT: 0,

    reset() { this.wave = 0; this.queue.length = 0; this.interT = 0.8; },

    poolFor(w) {
      const pool = ['seeker'];
      for (let i = 1; i < UNLOCKS.length && i <= w; i++) pool.push(...UNLOCKS[i]);
      return pool;
    },

    beginWave(g) {
      this.wave++;
      g.wave = this.wave;
      g.banner = { text: 'WAVE ' + this.wave, t: 0, dur: 2.0 };
      NV.Audio.setIntensity(this.wave, 'playing');
      NV.Audio.waveIn();

      let budget = 6 + this.wave * 2.6;
      const pool = this.poolFor(this.wave);
      const q = this.queue;
      q.length = 0;
      let guard = 300;
      while (budget > 0.9 && guard-- > 0) {
        const t = U.pick(pool);
        const cost = NV.Entities.DEFS[t].cost;
        if (cost > budget + 0.5) continue;
        budget -= cost;
        q.push(t);
      }
      q.sort(() => Math.random() - 0.5);
      this.spawnT = 0.3;
    },

    update(dt, g) {
      if (this.interT > 0) {
        this.interT -= dt;
        if (this.interT <= 0) this.beginWave(g);
        return;
      }

      if (this.queue.length > 0) {
        this.spawnT -= dt;
        if (this.spawnT <= 0) {
          const n = Math.min(this.queue.length, 1 + ((Math.random() * (1 + this.wave * 0.35)) | 0));
          const pos = this.spawnPos(g);
          const W = NV.CONFIG.WORLD_W, H = NV.CONFIG.WORLD_H;
          for (let i = 0; i < n; i++) {
            const t = this.queue.pop();
            g.enemies.push(new NV.Entities.Enemy(t,
              U.clamp(pos.x + U.rand(-30, 30), 30, W - 30),
              U.clamp(pos.y + U.rand(-30, 30), 30, H - 30)));
          }
          this.spawnT = U.rand(0.5, 1.15) * U.clamp(1.2 - this.wave * 0.04, 0.5, 1.2);
        }
      } else if (g.enemies.length === 0 && g.state === 'playing' && g.player && !g.player.dead) {
        /* Wave cleared. */
        const bonus = 100 * this.wave;
        g.score += bonus;
        g.banner = { text: 'WAVE ' + this.wave + ' CLEAR', t: 0, dur: 1.6, sub: '+' + bonus };
        NV.Audio.waveIn();
        this.interT = 2.0;
      }
    },

    /* 72% edge spawns, 28% interior — never closer than 300px to the player. */
    spawnPos(g) {
      const W = NV.CONFIG.WORLD_W, H = NV.CONFIG.WORLD_H, p = g.player;
      if (Math.random() < 0.72) {
        const side = (Math.random() * 4) | 0;
        if (side === 0) return { x: U.rand(40, W - 40), y: 42 };
        if (side === 1) return { x: W - 42, y: U.rand(40, H - 40) };
        if (side === 2) return { x: U.rand(40, W - 40), y: H - 42 };
        return { x: 42, y: U.rand(40, H - 40) };
      }
      for (let i = 0; i < 20; i++) {
        const x = U.rand(80, W - 80), y = U.rand(80, H - 80);
        if (U.dist2(x, y, p.x, p.y) > 300 * 300) return { x, y };
      }
      return { x: 60, y: 60 };
    },
  };

  window.NV.Waves = Waves;
})();

</script>
<script>
/* ==== inlined: js/game.js ==== */
'use strict';
/* ============================================================
   NEON VOID — game.js
   Orchestrator: state machine, fixed-substep main loop, all
   collision passes (spatial-hash culled), camera trauma shake,
   hit-stop / slow-motion, bombs, HUD, menus, game over stats.
   ============================================================ */
(function () {
  const U = NV.U, Render = NV.Render, Input = NV.Input, Grid = NV.Grid,
        Fx = NV.Fx, A = NV.Audio, Waves = NV.Waves;
  const { Enemy, Pickup, Player } = NV.Entities;
  const P = NV.PALETTE, CW = NV.CONFIG.WORLD_W, CH = NV.CONFIG.WORLD_H;

  const g = {
    state: 'boot', time: 0,
    player: null,
    enemies: [], bullets: [], ebullets: [], pickups: [], shocks: [], stars: [],
    hash: new U.SpatialHash(72), _q: [], _shockId: 0,
    score: 0, displayScore: 0, mult: 1, multPulse: 0, bombs: 2, wave: 1,
    shots: 0, hits: 0, kills: 0, playT: 0,
    hiScore: 0, newBest: false,
    freeze: 0, timeScale: 1, _tsTarget: 1, _slowT: 0,
    flash: 0, flashColor: '#ffffff',
    cam: { trauma: 0, x: 0, y: 0 },
    banner: null, overT: 0, menuT: 0, ambientT: 0,

    /* -------------------------------------------------- boot ---- */
    boot() {
      const canvas = document.getElementById('game');
      Render.init(canvas);
      Input.init(canvas);
      A.loadMute();
      Grid.init();
      this.makeStars();
      try { this.hiScore = +localStorage.getItem('nv_hiscore') || 0; } catch (e) {}

      const unlock = () => A.init();               // browsers need a gesture
      window.addEventListener('pointerdown', unlock);
      window.addEventListener('keydown', unlock);
      window.addEventListener('blur', () => { if (this.state === 'playing') this.setState('paused'); });

      this.setState('menu');
      let last = performance.now();
      const frame = (now) => {
        requestAnimationFrame(frame);
        const rdt = Math.min((now - last) / 1000, 0.05);
        last = now;
        this.tick(rdt);
      };
      requestAnimationFrame(frame);
    },

    makeStars() {
      this.stars = [];
      for (let i = 0; i < 110; i++)
        this.stars.push({ x: Math.random() * CW, y: Math.random() * CH, z: 0.25 + Math.random() * 0.75, tw: Math.random() * 10 });
    },

    setState(s) {
      this.state = s;
      if (s === 'menu') { this.menuT = 0; this.seedMenu(); }
      if (s === 'playing') A.setIntensity(this.wave, 'playing');
    },

    seedMenu() {
      this.enemies.length = 0; this.bullets.length = 0; this.ebullets.length = 0;
      this.pickups.length = 0; this.shocks.length = 0;
      for (let i = 0; i < 7; i++) {
        const e = new Enemy(U.pick(['drifter', 'seeker']),
          U.rand(100, CW - 100), U.rand(100, CH - 100), { instant: true });
        e.state = 'menu';
        e.vx = U.rand(-40, 40); e.vy = U.rand(-40, 40);
        this.enemies.push(e);
      }
      A.setIntensity(0, 'menu');
    },

    startGame() {
      this.enemies.length = 0; this.bullets.length = 0; this.ebullets.length = 0;
      this.pickups.length = 0; this.shocks.length = 0;
      Fx.reset();
      this.player = new Player();
      this.score = 0; this.displayScore = 0; this.mult = 1; this.multPulse = 0;
      this.bombs = NV.TUNE.player.startBombs;
      this.shots = 0; this.hits = 0; this.kills = 0; this.playT = 0;
      this.newBest = false; this.freeze = 0; this.flash = 0;
      this.timeScale = 1; this._tsTarget = 1; this._slowT = 0;
      this.banner = null; this.overT = 0;
      Waves.reset();
      this.setState('playing');
    },

    gameOver() {
      this.overT = 0;
      this.setState('gameover');
      if (this.score > this.hiScore) {
        this.hiScore = this.score; this.newBest = true;
        try { localStorage.setItem('nv_hiscore', String(this.score)); } catch (e) {}
      }
    },

    addTrauma(t) { this.cam.trauma = Math.min(1, this.cam.trauma + t); },
    slowmo(scale, dur) { this._tsTarget = scale; this._slowT = dur; },

    /* -------------------------------------------------- tick ---- */
    tick(rdt) {
      Input.update();

      if (Input.consume('KeyM')) { A.init(); A.toggleMute(); }
      if (this.state === 'menu' &&
          (Input.consume('Enter') || Input.consume('Space') ||
           (Input.mouse.down && this.menuT > 0.4))) {
        A.init(); this.startGame();
      } else if (this.state === 'playing' && (Input.consume('KeyP') || Input.consume('Escape'))) {
        this.setState('paused');
      } else if (this.state === 'paused' &&
                 (Input.consume('KeyP') || Input.consume('Escape') || Input.consume('Enter'))) {
        this.setState('playing');
      } else if (this.state === 'gameover' && this.overT > 1 &&
                 (Input.consume('Enter') || Input.consume('Space') || Input.consume('KeyR') || Input.mouse.down)) {
        this.startGame();
      }

      if (this.freeze > 0) {
        this.freeze -= rdt;                    // hit-stop: world holds its breath
      } else {
        if (this._slowT > 0) { this._slowT -= rdt; if (this._slowT <= 0) this._tsTarget = 1; }
        this.timeScale = U.lerp(this.timeScale, this._tsTarget, Math.min(1, rdt * 8));
        this.time += rdt;
        this.update(rdt * this.timeScale, rdt);
      }
      Input.endFrame();
      this.render();
    },

    update(dt, rdt) {
      /* Camera: trauma-based shake (quadratic falloff, noise-modulated). */
      this.cam.trauma = Math.max(0, this.cam.trauma - rdt * 1.5);
      const sh = this.cam.trauma * this.cam.trauma;
      this.cam.x = sh * 26 * Math.sin(this.time * 217) * Math.sin(this.time * 139);
      this.cam.y = sh * 22 * Math.sin(this.time * 193) * Math.sin(this.time * 167);
      this.flash = Math.max(0, this.flash - rdt * 2.2);
      this.displayScore += (this.score - this.displayScore) * Math.min(1, rdt * 10);
      this.multPulse = Math.max(0, this.multPulse - rdt * 3);

      if (this.state === 'playing') this.updatePlaying(dt);
      else if (this.state === 'menu') this.updateMenu(dt);
      else if (this.state === 'gameover') { this.overT += rdt; Fx.update(dt); Grid.update(dt); }
      /* paused: nothing simulates */
    },

    updateMenu(dt) {
      this.menuT += dt;
      for (const e of this.enemies) e.update(dt, this);
      U.compact(this.enemies);
      Fx.update(dt); Grid.update(dt);
      this.ambientT -= dt;
      if (this.ambientT <= 0) {
        this.ambientT = U.rand(0.8, 2.2);
        Grid.pulse(U.rand(200, CW - 200), U.rand(150, CH - 150), 220, U.rand(60, 160));
      }
      for (const s of this.stars) {
        s.x += 6 * s.z * dt; s.y += 3 * s.z * dt; s.tw += dt;
        if (s.x > CW) s.x -= CW;
        if (s.y > CH) s.y -= CH;
      }
    },

    /* ------------------------------------------------- world ---- */
    updatePlaying(dt) {
      const p = this.player;
      this.playT += dt;
      Waves.update(dt, this);
      if (this.banner) { this.banner.t += dt; if (this.banner.t > this.banner.dur) this.banner = null; }

      /* 1. Broad-phase hash (active enemies only). */
      this.hash.clear();
      for (const e of this.enemies) if (e.state === 'active' && !e.dead) this.hash.insert(e);

      /* 2. Player. */
      p.update(dt, this);

      /* 3. Enemies: behavior, movement, mutual separation. */
      for (const e of this.enemies) {
        if (e.dead) continue;
        e.update(dt, this);
        if (e.state === 'active' && !e.dead) {
          const near = this.hash.query(e.x, e.y, e.r + 46, this._q);
          for (const o of near) {
            if (o === e || o.dead) continue;
            const dx = o.x - e.x, dy = o.y - e.y;
            const rr = o.r + e.r, d2 = dx * dx + dy * dy;
            if (d2 < rr * rr && d2 > 0.001) {
              const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, push = (rr - d) * 0.5;
              e.x -= nx * push; e.y -= ny * push;
              o.x += nx * push; o.y += ny * push;
            }
          }
        }
      }

      /* 4. Enemy-player contact (only while the player is vulnerable). */
      if (!p.dead && p.invuln <= 0) {
        for (const e of this.enemies) {
          if (e.dead || e.state !== 'active') continue;
          if (U.dist2(e.x, e.y, p.x, p.y) < (e.r + p.r) * (e.r + p.r)) {
            e.die(false, this);
            p.takeHit(this);
          }
        }
      }

      /* 5. Gravity wells pull player, bullets, pickups. */
      for (const e of this.enemies) {
        if (e.dead || e.type !== 'well' || e.state !== 'active') continue;
        const R = 520;
        const pull = (o, mul) => {
          const dx = e.x - o.x, dy = e.y - o.y, d2 = dx * dx + dy * dy;
          if (d2 > R * R || d2 < 100) return;
          const d = Math.sqrt(d2);
          const a = Math.min(760, 5200000 / d2) * mul;
          o.vx += (dx / d) * a * dt;
          o.vy += (dy / d) * a * dt;
        };
        if (!p.dead) pull(p, 1);
        for (const b of this.bullets) if (!b.dead) pull(b, 0.55);
        for (const pk of this.pickups) if (!pk.dead) pull(pk, 0.3);
      }

      /* 6. Player bullets: swept collision vs enemies and enemy bullets. */
      for (const b of this.bullets) {
        if (b.dead) continue;
        b.px = b.x; b.py = b.y;
        b.x += b.vx * dt; b.y += b.vy * dt;
        b.life -= dt;
        if (b.life <= 0 || b.x < -20 || b.x > CW + 20 || b.y < -20 || b.y > CH + 20) {
          b.dead = true;
          continue;
        }
        const near = this.hash.query(b.x, b.y, 90, this._q);
        for (const e of near) {
          if (e.dead || e.state !== 'active') continue;
          const rr = e.r + b.r;
          if (U.segCircle(b.px, b.py, b.x, b.y, e.x, e.y, rr)) {
            b.dead = true; this.hits++;
            const l = Math.hypot(b.vx, b.vy) || 1;
            e.hurt(1, b.vx / l, b.vy / l, this);
            break;
          }
        }
        if (!b.dead) {
          for (const eb of this.ebullets) {
            if (eb.dead) continue;
            if (U.dist2(b.x, b.y, eb.x, eb.y) < 74) {      // (3.6+5)^2
              b.dead = true; eb.dead = true; this.hits++;
              this.score += 10 * this.mult;
              Fx.burst(eb.x, eb.y, P.ebullet, 6, 200, { life: 0.3 });
              A.enemyHit();
              break;
            }
          }
        }
      }

      /* 7. Enemy bullets. */
      for (const b of this.ebullets) {
        if (b.dead) continue;
        b.px = b.x; b.py = b.y;
        b.x += b.vx * dt; b.y += b.vy * dt;
        b.life -= dt;
        if (b.life <= 0 || b.x < 6 || b.x > CW - 6 || b.y < 6 || b.y > CH - 6) {
          b.dead = true;
          Fx.dot(b.x, b.y, P.ebullet, { sp: 60, life: 0.2, size: 2 });
          continue;
        }
        if (!p.dead && p.invuln <= 0 &&
            U.dist2(b.x, b.y, p.x, p.y) < (b.r + p.r) * (b.r + p.r)) {
          b.dead = true;
          p.takeHit(this);
        }
      }

      /* 8. Shockwaves (bombs). */
      for (const s of this.shocks) {
        if (s.dead) continue;
        s.r += s.speed * dt;
        s.life -= dt;
        if (s.life <= 0) { s.dead = true; continue; }
        for (const e of this.enemies) {
          if (e.dead || e.state !== 'active' || e.hitBy === s.id) continue;
          if (U.dist2(e.x, e.y, s.x, s.y) < (s.r + e.r) * (s.r + e.r)) {
            e.hitBy = s.id;
            const d = Math.max(1, Math.hypot(e.x - s.x, e.y - s.y));
            e.hurt(3, (e.x - s.x) / d, (e.y - s.y) / d, this);
          }
        }
        if (s.killBullets) {
          for (const b of this.ebullets) {
            if (!b.dead && U.dist2(b.x, b.y, s.x, s.y) < (s.r + 6) * (s.r + 6)) {
              b.dead = true;
              Fx.burst(b.x, b.y, P.ebullet, 4, 140, { life: 0.25 });
            }
          }
        }
      }

      /* 9. Pickups. */
      for (const k of this.pickups) if (!k.dead) k.update(dt, this);

      /* 10. Bomb trigger. */
      const wantBomb = Input.consume('KeyQ') || Input.consume('Space') ||
        Input.mouse.mEdge || Input.padEdge[2] || Input.padEdge[4];
      if (wantBomb && this.bombs > 0) this.useBomb();

      /* 11. FX, grid, parallax stars. */
      Fx.update(dt);
      Grid.update(dt);
      for (const s of this.stars) {
        s.x -= p.vx * 0.018 * s.z * dt; s.y -= p.vy * 0.018 * s.z * dt; s.tw += dt;
        if (s.x < 0) s.x += CW; if (s.x > CW) s.x -= CW;
        if (s.y < 0) s.y += CH; if (s.y > CH) s.y -= CH;
      }

      U.compact(this.enemies); U.compact(this.bullets); U.compact(this.ebullets);
      U.compact(this.pickups); U.compact(this.shocks);
    },

    spawnEBullet(x, y, a, sp) {
      this.ebullets.push({
        x, y, px: x, py: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 6, r: 5, dead: false,
      });
    },

    spawnPickup(kind, x, y) { this.pickups.push(new Pickup(kind, x, y)); },

    dropLoot(e) {
      const roll = Math.random();
      if (roll < 0.012) this.spawnPickup('life', e.x, e.y);
      else if (roll < 0.042) this.spawnPickup('bomb', e.x, e.y);
      else if (roll < 0.105) this.spawnPickup(U.pick(['triple', 'rapid', 'shield']), e.x, e.y);
      else if (roll < 0.25) this.spawnPickup('gem', e.x, e.y);
    },

    useBomb() {
      this.bombs--;
      const p = this.player;
      A.bomb();
      this.flash = 1; this.flashColor = '#cfe8ff';
      this.addTrauma(0.8);
      this.slowmo(0.45, 0.35);
      p.invuln = Math.max(p.invuln, 0.8);
      Grid.pulse(p.x, p.y, 900, 900);
      Grid.pulse(p.x, p.y, 500, -300);
      Fx.ring(p.x, p.y, '#ffffff', 10, 1500, 0.8, 4);
      Fx.ring(p.x, p.y, P.player, 10, 1100, 1.0, 3);
      Fx.burst(p.x, p.y, '#ffffff', 60, 700, { life: 0.7 });
      this.shocks.push({
        x: p.x, y: p.y, r: 20, speed: 1500, life: 0.55,
        killBullets: true, id: ++this._shockId, dead: false,
      });
    },

    /* ------------------------------------------------ rendering -- */
    render() {
      Render.begin();
      const c = Render.ctx;
      Render.world(this.cam.x, this.cam.y);

      /* Parallax starfield. */
      c.globalCompositeOperation = 'lighter';
      for (const s of this.stars) {
        c.globalAlpha = 0.25 + 0.55 * s.z * (0.6 + 0.4 * Math.sin(s.tw * 3 + s.x));
        c.fillStyle = '#9fb4ff';
        c.fillRect(s.x, s.y, s.z * 2.2, s.z * 2.2);
      }
      c.globalAlpha = 1;

      /* Warping lattice. */
      Grid.draw(c);

      /* Entities (all additive). */
      c.globalCompositeOperation = 'lighter';
      for (const k of this.pickups) if (!k.dead) k.draw(c);
      for (const e of this.enemies) if (!e.dead) e.draw(c, this);

      for (const b of this.ebullets) {
        if (b.dead) continue;
        Render.drawGlow(b.x, b.y, 12, P.ebullet, 0.8);
        c.fillStyle = '#ffd0c0';
        c.beginPath(); c.arc(b.x, b.y, b.r - 1.6, 0, U.TAU); c.fill();
        c.globalAlpha = 0.35; c.fillStyle = P.ebullet;
        c.beginPath(); c.arc(b.x, b.y, b.r + 1.5, 0, U.TAU); c.fill();
        c.globalAlpha = 1;
      }

      for (const b of this.bullets) {
        if (b.dead) continue;
        Render.drawGlow(b.x, b.y, 10, P.player, 0.7);
        c.lineCap = 'round';
        c.strokeStyle = P.bullet; c.lineWidth = 3.4; c.globalAlpha = 0.9;
        c.beginPath();
        c.moveTo(b.x - b.vx * 0.012, b.y - b.vy * 0.012);
        c.lineTo(b.x, b.y); c.stroke();
        c.strokeStyle = '#ffffff'; c.lineWidth = 1.4; c.globalAlpha = 1;
        c.beginPath();
        c.moveTo(b.x - b.vx * 0.008, b.y - b.vy * 0.008);
        c.lineTo(b.x, b.y); c.stroke();
      }

      for (const s of this.shocks)
        if (!s.dead) Render.neonCircle(s.x, s.y, s.r, '#ffffff', 2.5, U.clamp(s.life * 2, 0, 1) * 0.8);

      if (this.player && this.state !== 'menu') this.player.draw(c, this);

      Fx.draw(c);

      /* Arena border + world-space UI. */
      c.globalCompositeOperation = 'source-over';
      this.drawBorder(c);
      if (this.state === 'playing' || this.state === 'paused') this.drawHUD(c);

      /* State overlays. */
      if (this.state === 'menu') this.drawMenu(c);
      if (this.state === 'paused') this.drawPaused(c);
      if (this.state === 'gameover') this.drawGameOver(c);

      /* Damage / bomb flash. */
      if (this.flash > 0) {
        c.globalAlpha = Math.min(0.85, this.flash);
        c.fillStyle = this.flashColor;
        c.fillRect(-200, -200, CW + 400, CH + 400);
        c.globalAlpha = 1;
      }

      Render.post();
    },

    drawBorder(c) {
      const m = 10, L = 26;
      Render.neon([[m, m], [CW - m, m], [CW - m, CH - m], [m, CH - m]], P.border, 2, 0.8, true);
      Render.neon([[m, m + L], [m, m], [m + L, m]], '#5f8fff', 2.5, 0.9, false);
      Render.neon([[CW - m - L, m], [CW - m, m], [CW - m, m + L]], '#5f8fff', 2.5, 0.9, false);
      Render.neon([[CW - m, CH - m - L], [CW - m, CH - m], [CW - m - L, CH - m]], '#5f8fff', 2.5, 0.9, false);
      Render.neon([[m + L, CH - m], [m, CH - m], [m, CH - m - L]], '#5f8fff', 2.5, 0.9, false);
    },

    /* --------------------------------------------------- HUD ---- */
    drawHUD(c) {
      const p = this.player;
      c.textBaseline = 'alphabetic';

      /* Score, top-left. */
      c.textAlign = 'left';
      c.font = '700 13px system-ui, sans-serif';
      c.fillStyle = P.dim;
      c.fillText('SCORE', 28, 40);
      c.font = '900 34px system-ui, sans-serif';
      c.fillStyle = '#ffffff';
      c.shadowColor = P.player; c.shadowBlur = 14;
      c.fillText(String(Math.round(this.displayScore)).padStart(7, '0'), 28, 72);
      c.shadowBlur = 0;
      c.font = '700 13px system-ui, sans-serif';
      c.fillStyle = P.dim;
      c.fillText('HI ' + String(Math.max(this.hiScore, this.score)).padStart(7, '0'), 28, 94);
      c.fillText('WAVE ' + this.wave, 28, 114);

      /* Multiplier, top-right. */
      c.textAlign = 'right';
      c.font = '700 12px system-ui, sans-serif';
      c.fillStyle = P.dim;
      c.fillText('MULTIPLIER', CW - 28, 40);
      c.font = `900 ${30 + this.multPulse * 26}px system-ui, sans-serif`;
      c.fillStyle = this.mult > 1 ? P.mult : P.dim;
      if (this.mult > 1) { c.shadowColor = P.mult; c.shadowBlur = 16; }
      c.fillText('x' + this.mult, CW - 28, 72);
      c.shadowBlur = 0;

      /* Lives, bottom-left. */
      for (let i = 0; i < p.lives; i++)
        Render.neonPoly(42 + i * 30, CH - 40, 9, 3, -Math.PI / 2, P.player, 1.6, 0.9);

      /* Bombs + dash bar, bottom-right. */
      c.textAlign = 'right';
      c.font = '700 12px system-ui, sans-serif';
      c.fillStyle = P.dim;
      c.fillText('BOMBS [SPACE]', CW - 28, CH - 58);
      for (let i = 0; i < this.bombs; i++)
        Render.neonPoly(CW - 40 - i * 26, CH - 36, 8, 4, 0, '#ffb020', 1.8, 1);
      const dr = 1 - U.clamp(p.dashCd / NV.TUNE.player.dashCd, 0, 1);
      c.fillStyle = 'rgba(120,150,220,0.25)';
      c.fillRect(CW - 148, CH - 22, 120, 4);
      c.fillStyle = dr >= 1 ? P.player : 'rgba(69,240,255,0.45)';
      c.fillRect(CW - 148, CH - 22, 120 * dr, 4);
      c.font = '700 11px system-ui, sans-serif';
      c.fillStyle = P.dim;
      c.fillText('DASH [SHIFT]', CW - 156, CH - 18);

      /* Active powerup timers, bottom-center. */
      let py = CH - 24;
      const bar = (label, t, colr) => {
        const w = 150;
        c.textAlign = 'left';
        c.font = '700 11px system-ui, sans-serif';
        c.fillStyle = colr;
        c.fillText(label, CW / 2 - w / 2, py - 6);
        c.fillStyle = 'rgba(255,255,255,0.15)';
        c.fillRect(CW / 2 - w / 2, py, w, 3);
        c.fillStyle = colr;
        c.fillRect(CW / 2 - w / 2, py, w * (t / NV.TUNE.powerupTime), 3);
        py -= 26;
      };
      if (p.powerTriple > 0) bar('TRIPLE SHOT', p.powerTriple, '#ffd23c');
      if (p.powerRapid > 0) bar('RAPID FIRE', p.powerRapid, '#ff5cf0');

      /* Sound hint. */
      c.textAlign = 'center';
      c.font = '700 11px system-ui, sans-serif';
      c.fillStyle = 'rgba(125,143,201,0.55)';
      c.fillText('[M] SOUND ' + (A.muted ? 'OFF' : 'ON'), CW / 2, CH - 18);

      /* Wave banner. */
      if (this.banner) {
        const b = this.banner;
        const inK = U.clamp(b.t / 0.25, 0, 1);
        const outK = U.clamp((b.dur - b.t) / 0.4, 0, 1);
        const a = Math.min(inK, outK);
        const y = CH * 0.30;
        Render.spaced(b.text, CW / 2, y, 54, 14, `rgba(255,255,255,${a})`);
        if (b.sub) Render.spaced(b.sub, CW / 2, y + 44, 20, 8, `rgba(255,210,60,${a})`);
      }
    },

    /* ------------------------------------------------- menus ---- */
    drawMenu(c) {
      c.fillStyle = 'rgba(3,5,14,0.55)';
      c.fillRect(0, 0, CW, CH);
      const t = this.menuT;
      const a = Math.min(1, t / 0.8);
      const ty = CH * 0.26 + Math.sin(t * 1.4) * 6;

      c.shadowColor = P.player; c.shadowBlur = 38;
      Render.spaced('NEON VOID', CW / 2, ty, 88, 24, `rgba(69,240,255,${0.85 * a})`);
      c.shadowBlur = 0;
      Render.spaced('NEON VOID', CW / 2, ty, 88, 24, `rgba(255,255,255,${a})`);
      Render.spaced('A TWIN-STICK ARCADE SHOOTER', CW / 2, ty + 58, 17, 9, `rgba(125,143,201,${a})`, 'center', 700);

      if (this.hiScore > 0)
        Render.spaced('BEST ' + String(this.hiScore).padStart(7, '0'), CW / 2, ty + 96, 20, 8, `rgba(255,210,60,${a})`);

      /* Blinking prompt. */
      const pa = (0.55 + 0.45 * Math.sin(t * 4)) * Math.min(1, t / 0.5);
      Render.spaced('CLICK OR PRESS ENTER TO START', CW / 2, CH * 0.56, 24, 10, `rgba(223,232,255,${pa})`);

      /* Controls table. */
      const rows = [
        ['MOVE', 'W A S D  /  ARROWS  /  LEFT STICK'],
        ['AIM + FIRE', 'MOUSE  /  RIGHT STICK'],
        ['DASH', 'SHIFT  /  RIGHT CLICK  /  RB'],
        ['BOMB', 'SPACE  /  Q  /  X'],
        ['PAUSE · MUTE', 'P OR ESC  ·  M'],
      ];
      c.font = '600 15px system-ui, sans-serif';
      c.textBaseline = 'middle';
      let y = CH * 0.70;
      for (const r of rows) {
        c.textAlign = 'right';
        c.fillStyle = P.dim;
        c.fillText(r[0], CW / 2 - 20, y);
        c.textAlign = 'left';
        c.fillStyle = P.text;
        c.fillText(r[1], CW / 2 + 20, y);
        y += 27;
      }
      c.textBaseline = 'alphabetic';

      Render.spaced('VANILLA JS · NO ASSETS · NO LIBRARIES', CW / 2, CH - 34, 12, 6, 'rgba(125,143,201,0.6)', 'center', 700);
    },

    drawPaused(c) {
      c.fillStyle = 'rgba(3,5,14,0.66)';
      c.fillRect(0, 0, CW, CH);
      Render.spaced('PAUSED', CW / 2, CH * 0.42, 54, 16, '#ffffff');
      Render.spaced('P / ESC TO RESUME', CW / 2, CH * 0.52, 16, 8, P.dim, 'center', 700);
    },

    drawGameOver(c) {
      const a = U.clamp((this.overT - 0.3) / 0.5, 0, 1);
      if (a <= 0) return;
      c.fillStyle = `rgba(3,5,14,${0.78 * a})`;
      c.fillRect(0, 0, CW, CH);
      c.globalAlpha = a;

      Render.spaced('GAME OVER', CW / 2, CH * 0.24, 64, 18, '#ff5a5a');

      if (this.newBest) {
        const b = 0.6 + 0.4 * Math.sin(this.time * 6);
        Render.spaced('NEW BEST!', CW / 2, CH * 0.33, 24, 10, `rgba(255,210,60,${b})`);
      }

      c.font = '900 44px system-ui, sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'alphabetic';
      c.fillStyle = '#ffffff';
      c.shadowColor = P.player; c.shadowBlur = 18;
      c.fillText(String(this.score).padStart(7, '0'), CW / 2, CH * 0.47);
      c.shadowBlur = 0;

      const acc = this.shots ? Math.round(100 * this.hits / this.shots) : 0;
      const mm = (this.playT / 60) | 0, ss = String((this.playT % 60) | 0).padStart(2, '0');
      const rows = [
        ['WAVE REACHED', String(this.wave)],
        ['ENEMIES DESTROYED', String(this.kills)],
        ['ACCURACY', acc + '%'],
        ['TIME SURVIVED', mm + ':' + ss],
        ['BEST', String(this.hiScore).padStart(7, '0')],
      ];
      c.font = '600 17px system-ui, sans-serif';
      let y = CH * 0.55;
      for (const r of rows) {
        c.textAlign = 'left'; c.fillStyle = P.dim;
        c.fillText(r[0], CW / 2 - 230, y);
        c.textAlign = 'right'; c.fillStyle = P.text;
        c.fillText(r[1], CW / 2 + 230, y);
        y += 32;
      }

      const pa = 0.55 + 0.45 * Math.sin(this.time * 4);
      Render.spaced('ENTER / CLICK TO RETRY', CW / 2, CH * 0.88, 20, 9, `rgba(223,232,255,${pa})`);
      c.globalAlpha = 1;
    },
  };

  window.NV = window.NV || {};
  window.NV.game = g;
  g.boot();
})();

</script>
</body>
</html>
