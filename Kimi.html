<!-- NEON VOID — standalone single-file build.
     All 10 source modules inlined verbatim; identical to the multi-file version.
     Open in any modern browser. No engine, no libraries, no server. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>NEON VOID — vector arcade shooter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='16,3 29,26 16,20 3,26' fill='%2345f0ff'/></svg>">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #04060f; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #err {
    position: fixed; left: 8px; bottom: 8px; color: #ff6a6a;
    font: 11px/1.45 monospace; white-space: pre-wrap; max-width: 90vw;
    pointer-events: none; text-shadow: 0 0 6px #000; z-index: 9;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="err"></div>
<script>
  /* Runtime error overlay — invaluable during development, invisible in normal play. */
  window.addEventListener('error', function (e) {
    var d = document.getElementById('err');
    d.textContent += (e.message || e.error) + '\n  at ' + (e.filename || '') + ':' + (e.lineno || '') + '\n';
  });
</script>
<script>
/* ==== inlined: js/config.js ==== */
'use strict';
/* ============================================================
   NEON VOID — config.js
   All gameplay tuning constants and the color palette.
   ============================================================ */
window.NV = window.NV || {};

NV.CONFIG = {
  WORLD_W: 1600,          // logical arena size (letterboxed to any screen)
  WORLD_H: 900,
  GRID_SPACING: 40,       // warping background lattice
  MAX_PARTICLES: 1400,    // hard cap for the pooled particle system
};

NV.TUNE = {
  player: {
    radius: 11,
    accel: 2700,          // thrust px/s^2
    drag: 3.0,            // exponential damping coefficient
    maxSpeed: 560,
    fireCd: 0.115,
    fireCdRapid: 0.072,
    bulletSpeed: 990,
    bulletLife: 1.0,
    dashTime: 0.14,
    dashSpeed: 2150,
    dashCd: 1.5,
    startLives: 3,
    maxLives: 6,
    startBombs: 2,
    maxBombs: 4,
    respawnInvuln: 2.6,
    hitInvuln: 1.2,
  },
  powerupTime: 12,        // seconds triple/rapid last
  multiplierMax: 8,
  magnetDist: 130,        // pickup magnet radius
};

NV.PALETTE = {
  bg: '#04060f',
  grid: 'rgba(56, 92, 178, 0.20)',
  gridHot: 'rgba(120, 170, 255, 0.55)',
  border: '#2c4a8f',
  player: '#45f0ff',
  playerCore: '#ffffff',
  bullet: '#9ff8ff',
  ebullet: '#ff6a3c',
  text: '#dfe8ff',
  dim: '#7d8fc9',
  gold: '#ffd23c',
  mult: '#5cff8f',
};

</script>
<script>
/* ==== inlined: js/utils.js ==== */
'use strict';
/* ============================================================
   NEON VOID — utils.js
   Math helpers, in-place array compaction, swept-segment
   collision tests and a uniform-grid spatial hash for
   broad-phase collision culling.
   ============================================================ */
(function () {
  const U = {};

  U.TAU = Math.PI * 2;
  U.clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
  U.pick = (arr) => arr[(Math.random() * arr.length) | 0];
  U.dist2 = (x1, y1, x2, y2) => { const dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; };
  U.easeOut = (t) => 1 - (1 - t) * (1 - t);

  /* Remove every element whose `.dead` flag is set — in place, no allocation. */
  U.compact = (arr) => {
    let j = 0;
    for (let i = 0; i < arr.length; i++) { const o = arr[i]; if (!o.dead) arr[j++] = o; }
    arr.length = j;
  };

  /* Regular polygon: n vertices on the unit circle, optionally rotated. */
  U.poly = (n, rot = 0) => {
    const p = [];
    for (let i = 0; i < n; i++) { const a = rot + (i / n) * U.TAU; p.push([Math.cos(a), Math.sin(a)]); }
    return p;
  };

  /* Star polygon: `spikes` long points alternating with short ones. */
  U.star = (spikes, ratio = 0.45, rot = 0) => {
    const p = [], n = spikes * 2;
    for (let i = 0; i < n; i++) {
      const a = rot + (i / n) * U.TAU, r = (i % 2 === 0) ? 1 : ratio;
      p.push([Math.cos(a) * r, Math.sin(a) * r]);
    }
    return p;
  };

  /* Sweep test: does segment (x1,y1)->(x2,y2) pass within r of (cx,cy)?
     Used so fast bullets never tunnel through enemies between frames.  */
  U.segCircle = (x1, y1, x2, y2, cx, cy, r) => {
    const dx = x2 - x1, dy = y2 - y1;
    const fx = x1 - cx, fy = y1 - cy;
    const a = dx * dx + dy * dy;
    let t = a > 1e-9 ? -(fx * dx + fy * dy) / a : 0;
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    const px = fx + dx * t, py = fy + dy * t;
    return px * px + py * py <= r * r;
  };

  /* Uniform-grid spatial hash. Rebuilt every frame from enemy positions;
     queries return candidates that exact circle/segment tests then refine. */
  U.SpatialHash = class {
    constructor(cell) { this.cell = cell; this.map = new Map(); }
    clear() { this.map.clear(); }
    _key(cx, cy) { return (cx + 512) * 4096 + (cy + 512); }
    insert(e) {
      const k = this._key(Math.floor(e.x / this.cell), Math.floor(e.y / this.cell));
      let a = this.map.get(k);
      if (!a) { a = []; this.map.set(k, a); }
      a.push(e);
    }
    query(x, y, r, out) {
      out.length = 0;
      const c = this.cell;
      const x0 = Math.floor((x - r) / c), x1 = Math.floor((x + r) / c);
      const y0 = Math.floor((y - r) / c), y1 = Math.floor((y + r) / c);
      for (let cx = x0; cx <= x1; cx++) {
        for (let cy = y0; cy <= y1; cy++) {
          const a = this.map.get(this._key(cx, cy));
          if (a) for (let i = 0; i < a.length; i++) out.push(a[i]);
        }
      }
      return out;
    }
  };

  window.NV.U = U;
})();

</script>
<script>
/* ==== inlined: js/render.js ==== */
'use strict';
/* ============================================================
   NEON VOID — render.js
   Resolution-independent letterboxed canvas + the neon vector
   drawing toolkit:

   • multi-pass strokes        → glow lines without shadowBlur cost
   • cached radial glow sprites→ cheap additive bloom for anything
   • letterbox transform       → fixed 1600x900 arena on any screen
   • spaced text               → arcade-style letter-spaced display type
   ============================================================ */
(function () {
  const Render = {
    canvas: null, ctx: null,
    dpr: 1, scale: 1, offX: 0, offY: 0, cssW: 0, cssH: 0,
    _glows: new Map(), _scan: null, _vig: null,

    init(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d', { alpha: false });
      this.resize();
      window.addEventListener('resize', () => this.resize());
    },

    resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth, h = window.innerHeight;
      this.dpr = dpr; this.cssW = w; this.cssH = h;
      this.canvas.width = Math.round(w * dpr);
      this.canvas.height = Math.round(h * dpr);
      const W = NV.CONFIG.WORLD_W, H = NV.CONFIG.WORLD_H;
      this.scale = Math.min(w / W, h / H);          // fit, keep aspect
      this.offX = (w - W * this.scale) * 0.5;       // letterbox margins
      this.offY = (h - H * this.scale) * 0.5;
      this._vig = null;                             // rebuild lazily
    },

    screenToWorld(sx, sy) {
      return { x: (sx - this.offX) / this.scale, y: (sy - this.offY) / this.scale };
    },

    /* Clear to the background color in screen space. */
    begin() {
      const c = this.ctx;
      c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
      c.fillStyle = NV.PALETTE.bg;
      c.fillRect(0, 0, this.cssW, this.cssH);
    },

    /* World transform, including camera shake offset. */
    world(camX = 0, camY = 0) {
      const c = this.ctx, s = this.dpr * this.scale;
      c.setTransform(s, 0, 0, s,
        this.dpr * (this.offX + camX * this.scale),
        this.dpr * (this.offY + camY * this.scale));
    },

    /* Screen-space post processing: vignette + subtle scanlines. */
    post() {
      const c = this.ctx;
      c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      c.globalCompositeOperation = 'source-over';
      c.globalAlpha = 1;
      if (!this._vig || this._vig.width !== this.cssW || this._vig.height !== this.cssH) {
        const v = document.createElement('canvas');
        v.width = Math.max(2, this.cssW); v.height = Math.max(2, this.cssH);
        const g = v.getContext('2d');
        const gr = g.createRadialGradient(
          v.width / 2, v.height / 2, Math.min(v.width, v.height) * 0.36,
          v.width / 2, v.height / 2, Math.max(v.width, v.height) * 0.72);
        gr.addColorStop(0, 'rgba(2,4,12,0)');
        gr.addColorStop(1, 'rgba(2,4,12,0.62)');
        g.fillStyle = gr; g.fillRect(0, 0, v.width, v.height);
        this._vig = v;
      }
      c.drawImage(this._vig, 0, 0);
      if (!this._scan) {
        const s = document.createElement('canvas');
        s.width = 1; s.height = 3;
        const g = s.getContext('2d');
        g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(0, 2, 1, 1);
        this._scan = c.createPattern(s, 'repeat');
      }
      c.globalAlpha = 0.13;
      c.fillStyle = this._scan;
      c.fillRect(0, 0, this.cssW, this.cssH);
      c.globalAlpha = 1;
    },

    /* Cached radial-gradient sprite, composited additively for cheap bloom. */
    glowSprite(color) {
      let s = this._glows.get(color);
      if (!s) {
        s = document.createElement('canvas');
        s.width = s.height = 128;
        const g = s.getContext('2d');
        const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
        gr.addColorStop(0, 'rgba(255,255,255,0.85)');
        gr.addColorStop(0.25, color);
        gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = gr;
        g.fillRect(0, 0, 128, 128);
        this._glows.set(color, s);
      }
      return s;
    },

    drawGlow(x, y, r, color, alpha = 1) {
      if (alpha <= 0) return;
      const c = this.ctx;
      c.globalAlpha = alpha;
      c.drawImage(this.glowSprite(color), x - r, y - r, r * 2, r * 2);
      c.globalAlpha = 1;
    },

    /* The signature look: three stroke passes (wide faint → mid → bright core).
       Best used with globalCompositeOperation = 'lighter'. */
    neon(pts, color, width = 2, alpha = 1, close = true) {
      if (alpha <= 0 || pts.length < 2) return;
      const c = this.ctx;
      c.strokeStyle = color;
      c.lineJoin = 'round'; c.lineCap = 'round';
      const passes = [[width * 5, 0.08], [width * 2.1, 0.22], [width, 1]];
      for (let p = 0; p < 3; p++) {
        c.globalAlpha = alpha * passes[p][1];
        c.lineWidth = passes[p][0];
        c.beginPath();
        c.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
        if (close) c.closePath();
        c.stroke();
      }
      c.globalAlpha = 1;
    },

    neonPoly(x, y, r, sides, rot, color, width = 2, alpha = 1) {
      const TAU = NV.U.TAU, pts = [];
      for (let i = 0; i < sides; i++) {
        const a = rot + (i / sides) * TAU;
        pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r]);
      }
      this.neon(pts, color, width, alpha, true);
    },

    neonCircle(x, y, r, color, width = 2, alpha = 1) {
      if (alpha <= 0) return;
      const c = this.ctx;
      c.strokeStyle = color; c.lineCap = 'round';
      const passes = [[width * 4, 0.08], [width, 0.85]];
      for (let p = 0; p < 2; p++) {
        c.globalAlpha = alpha * passes[p][1];
        c.lineWidth = passes[p][0];
        c.beginPath();
        c.arc(x, y, Math.max(0.1, r), 0, NV.U.TAU);
        c.stroke();
      }
      c.globalAlpha = 1;
    },

    /* Arcade-style letter-spaced display text. Returns measured width. */
    spaced(text, x, y, size, spacing, color, align = 'center', weight = 900) {
      const c = this.ctx;
      c.font = `${weight} ${size}px system-ui, sans-serif`;
      c.textBaseline = 'middle';
      c.fillStyle = color;
      let w = 0;
      const widths = [];
      for (const ch of text) { const cw = c.measureText(ch).width; widths.push(cw); w += cw + spacing; }
      w -= spacing;
      let cx = align === 'center' ? x - w / 2 : (align === 'right' ? x - w : x);
      c.textAlign = 'left';
      for (let i = 0; i < text.length; i++) { c.fillText(text[i], cx, y); cx += widths[i] + spacing; }
      return w;
    },
  };

  window.NV.Render = Render;
})();

</script>
<script>
/* ==== inlined: js/audio.js ==== */
'use strict';
/* ============================================================
   NEON VOID — audio.js
   100% procedural audio. There is not a single sample file in
   this game: every sound effect is an oscillator/noise recipe,
   and the soundtrack is generated live by a 16th-note scheduler
   playing an A-minor-pentatonic pattern whose density, tempo
   and layers scale with the wave number.
   ============================================================ */
(function () {
  const Audio = {
    ctx: null, master: null, sfx: null, musicBus: null, delay: null,
    muted: false, _noise: null,
    step: 0, nextT: 0, bpm: 108, intensity: 0.1,

    /* Must be called from a user gesture (browser autoplay policy). */
    init() {
      if (this.ctx) {
        if (this.ctx.state === 'suspended') {
          const r = this.ctx.resume();
          if (r && r.catch) r.catch(() => {});
        }
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        const ctx = this.ctx = new AC();
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -18; comp.ratio.value = 6;
        comp.connect(ctx.destination);
        this.master = ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.85;
        this.master.connect(comp);
        this.sfx = ctx.createGain(); this.sfx.gain.value = 0.9; this.sfx.connect(this.master);
        this.musicBus = ctx.createGain(); this.musicBus.gain.value = 0.55; this.musicBus.connect(this.master);
        // dubby feedback delay shared by all musical voices
        this.delay = ctx.createDelay(1.0);
        this.delay.delayTime.value = 0.29;
        const fb = ctx.createGain(); fb.gain.value = 0.34;
        this.delay.connect(fb); fb.connect(this.delay);
        const wet = ctx.createGain(); wet.gain.value = 0.5;
        this.delay.connect(wet); wet.connect(this.musicBus);
        // one second of white noise, reused by every noise-based sound
        const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        this._noise = buf;
        this.nextT = ctx.currentTime + 0.1;
        setInterval(() => this._schedule(), 40); // lookahead scheduler
      } catch (e) { this.ctx = null; }
    },

    toggleMute() {
      this.muted = !this.muted;
      if (this.master) this.master.gain.value = this.muted ? 0 : 0.85;
      try { localStorage.setItem('nv_mute', this.muted ? '1' : '0'); } catch (e) {}
    },
    loadMute() { try { this.muted = localStorage.getItem('nv_mute') === '1'; } catch (e) {} },

    /* ---------- primitive voices ---------------------------------- */
    /* One oscillator with pitch ramp, optional lowpass, attack and
       echo send. Every SFX and every musical note routes through here. */
    voice(o) {
      if (!this.ctx) return;
      const ctx = this.ctx, t = o.when !== undefined ? o.when : ctx.currentTime;
      const osc = ctx.createOscillator();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(Math.max(20, o.f0 || 440), t);
      if (o.f1 && o.f1 !== o.f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t + o.dur);
      const g = ctx.createGain();
      const v = o.vol !== undefined ? o.vol : 0.2;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + (o.attack || 0.004));
      g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
      let node = osc;
      if (o.lp) {
        const f = ctx.createBiquadFilter();
        f.type = 'lowpass'; f.frequency.value = o.lp;
        osc.connect(f); node = f;
      }
      node.connect(g);
      g.connect(o.dest || this.sfx);
      if (o.echo) { const e = ctx.createGain(); e.gain.value = 0.5; g.connect(e); e.connect(this.delay); }
      osc.start(t); osc.stop(t + o.dur + 0.1);
    },

    /* Filtered white noise burst (explosions, whooshes, hats). */
    noise(o) {
      if (!this.ctx) return;
      const ctx = this.ctx, t = o.when !== undefined ? o.when : ctx.currentTime;
      const src = ctx.createBufferSource();
      src.buffer = this._noise; src.loop = true;
      const f = ctx.createBiquadFilter();
      f.type = o.ftype || 'lowpass'; f.Q.value = o.q || 0.8;
      f.frequency.setValueAtTime(Math.max(30, o.f0 || 4000), t);
      if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(30, o.f1), t + o.dur);
      const g = ctx.createGain();
      const v = o.vol !== undefined ? o.vol : 0.3;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + (o.attack || 0.006));
      g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
      src.connect(f); f.connect(g); g.connect(o.dest || this.sfx);
      src.start(t); src.stop(t + o.dur + 0.05);
    },

    /* ---------- sound effects ------------------------------------- */
    shoot()      { const d = 60 + Math.random() * 40;
                   this.voice({ type: 'square',   f0: 720 + d, f1: 190, dur: 0.07,  vol: 0.045 });
                   this.voice({ type: 'sawtooth', f0: 1500 + d * 2, f1: 340, dur: 0.045, vol: 0.02 }); },
    enemyHit()   { this.voice({ type: 'triangle', f0: 480 + Math.random() * 120, f1: 240, dur: 0.05, vol: 0.05 }); },
    enemyDie(s)  { this.voice({ type: 'triangle', f0: 520 + Math.random() * 80, f1: 55, dur: 0.12 + 0.06 * s, vol: 0.12 });
                   this.noise({ f0: 2600, f1: 220, dur: 0.1 + 0.06 * s, vol: 0.1 }); },
    explosion(s = 1) { this.noise({ f0: 3200, f1: 60,  dur: 0.45 + 0.25 * s, vol: 0.4 });
                       this.voice({ type: 'sine', f0: 140, f1: 32, dur: 0.35 + 0.2 * s, vol: 0.35 }); },
    playerDeath(){ this.explosion(1.6);
                   this.voice({ type: 'sawtooth', f0: 320, f1: 36, dur: 0.9, vol: 0.22 });
                   this.noise({ ftype: 'bandpass', f0: 900, f1: 90, dur: 0.7, vol: 0.2, q: 1.2 }); },
    dash()       { this.noise({ ftype: 'bandpass', f0: 320, f1: 4600, dur: 0.2, vol: 0.22, q: 1.6 });
                   this.voice({ type: 'sine', f0: 200, f1: 900, dur: 0.12, vol: 0.05 }); },
    pickup()     { if (!this.ctx) return; const t = this.ctx.currentTime;
                   this.voice({ type: 'sine', f0: 660, dur: 0.07, vol: 0.14, when: t });
                   this.voice({ type: 'sine', f0: 990, dur: 0.10, vol: 0.14, when: t + 0.07 }); },
    multUp(n)    { if (!this.ctx) return; const t = this.ctx.currentTime;
                   for (let i = 0; i < 3; i++)
                     this.voice({ type: 'triangle', f0: 480 * Math.pow(1.26, i + Math.min(3, n - 1)), dur: 0.09, vol: 0.1, when: t + i * 0.055 }); },
    bomb()       { this.voice({ type: 'sine', f0: 58, f1: 26, dur: 1.1, vol: 0.55 });
                   this.noise({ f0: 7000, f1: 120, dur: 0.9, vol: 0.4 });
                   this.noise({ ftype: 'highpass', f0: 300, dur: 0.5, vol: 0.12 }); },
    enemyShoot() { this.voice({ type: 'square', f0: 230, f1: 90, dur: 0.09, vol: 0.05 }); },
    waveIn()     { if (!this.ctx) return; const t = this.ctx.currentTime;
                   this.voice({ type: 'triangle', f0: 440, dur: 0.12, vol: 0.12, when: t });
                   this.voice({ type: 'triangle', f0: 660, dur: 0.16, vol: 0.12, when: t + 0.11 });
                   this.voice({ type: 'triangle', f0: 880, dur: 0.22, vol: 0.12, when: t + 0.22, echo: true }); },
    wellPulse()  { this.voice({ type: 'sine', f0: 74, f1: 60, dur: 0.24, vol: 0.14 }); },

    /* ---------- generative soundtrack ------------------------------ */
    setIntensity(wave, state) {
      this.intensity = state === 'playing' ? Math.min(1, 0.18 + wave * 0.05) : 0.1;
      this.bpm = state === 'playing' ? Math.min(146, 108 + wave * 2) : 100;
    },

    _schedule() {
      const ctx = this.ctx;
      if (!ctx) return;
      const sixteenth = (60 / this.bpm) / 4;
      while (this.nextT < ctx.currentTime + 0.18) {
        this._playStep(this.step, this.nextT);
        this.step = (this.step + 1) % 64;
        this.nextT += sixteenth;
      }
    },

    /* One 16th note. Pattern (A minor, 4 bars of 16 steps):
       pad chord every 2 bars, saw bass half-notes, sub kick off-beat,
       pentatonic arps through a feedback delay, noise hats.            */
    _playStep(s, t) {
      const roots = [110, 87.31, 130.81, 98];                 // A2 F2 C3 G2
      const penta = [220, 261.63, 293.66, 329.63, 392, 440];  // A min pentatonic
      const bar = (s / 16) | 0, root = roots[bar], I = this.intensity, M = this.musicBus;

      if (s % 32 === 0)
        for (const mul of [2, 3.01])
          this.voice({ type: 'sawtooth', f0: root * mul, dur: 2.2, vol: 0.028, attack: 0.9, lp: 620, when: t, dest: M });

        this.voice({ type: 'sawtooth', f0: root, dur: 0.4, vol: 0.085, lp: 420, when: t, dest: M });

      if (I > 0.3 && s % 8 === 4)
        this.voice({ type: 'sine', f0: 72, f1: 40, dur: 0.13, vol: 0.1, when: t, dest: M });

      if (s % 2 === 0 && Math.random() < 0.18 + I * 0.5) {
        const f = penta[(s * 5 + bar * 3) % 6] * (Math.random() < 0.25 ? 2 : 1);
        this.voice({ type: 'triangle', f0: f, dur: 0.16, vol: 0.045, when: t, echo: true, dest: M });
      }

      if (I > 0.5 && s % 2 === 1)

   ============================================================ */

      this.mouse.wy = NV.CONFIG.WORLD_H / 2;

        if (this._blockable(e.code)) e.preventDefault();
        if (e.repeat) return;
        this.keys[e.code] = true;
        this.pressed[e.code] = true;
      });
      window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });
      window.addEventListener('blur', () => { this.keys = Object.create(null); });

        const m = this.mouse;
        m.x = e.clientX; m.y = e.clientY;
        const w = NV.Render.screenToWorld(e.clientX, e.clientY);
        m.wx = w.x; m.wy = w.y;

    _blockable(code) { return code === 'Space' || code.startsWith('Arrow'); },

    /* Edge-triggered key press: true at most once per press. */

      if (this.pressed[code]) { this.pressed[code] = false; return true; }

    },

    update() {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];

      this.padEdge = Object.create(null);
      const p = this.pad;
      if (p) {
        for (let i = 0; i < p.buttons.length; i++) {

          this._padPrev[i] = now;

    endFrame() {

      if (this.keys.KeyD || this.keys.ArrowRight) x += 1;
      if (this.keys.KeyW || this.keys.ArrowUp)    y -= 1;
      if (this.keys.KeyS || this.keys.ArrowDown)  y += 1;

        if (Math.abs(ax) > 0.22) x += ax;
        if (Math.abs(ay) > 0.22) y += ay;

        if (p.buttons[0] && p.buttons[0].pressed) f = true;

<script>
/* ==== inlined: js/grid.js ==== */
'use strict';
/* ============================================================
   NEON VOID — grid.js
   The warping background lattice: every point is a damped spring
   anchored to its rest position. Explosions, thrust, bombs and
   black holes push ripples through it. Runs on fixed 120 Hz
   sub-steps so behavior is identical at any frame rate.
   ============================================================ */
(function () {
  const Grid = {
    pts: [], cols: 0, rows: 0, spacing: 40, _acc: 0,

    init() {
      const C = NV.CONFIG, sp = this.spacing = C.GRID_SPACING;
      this.cols = Math.round(C.WORLD_W / sp) + 1;
      this.rows = Math.round(C.WORLD_H / sp) + 1;
      this.pts = [];
      const ox = (C.WORLD_W - (this.cols - 1) * sp) / 2;
      const oy = (C.WORLD_H - (this.rows - 1) * sp) / 2;
      for (let r = 0; r < this.rows; r++) {
        for (let c = 0; c < this.cols; c++) {
          const x = ox + c * sp, y = oy + r * sp;
          this.pts.push({ x, y, ox: x, oy: y, vx: 0, vy: 0 });
        }
      }
    },

    /* Radial push (negative strength = implosion pull). */
    pulse(x, y, radius, strength) {
      const r2 = radius * radius;
      for (const p of this.pts) {
        const dx = p.x - x, dy = p.y - y, d2 = dx * dx + dy * dy;
        if (d2 > r2 || d2 < 1e-6) continue;
        const d = Math.sqrt(d2);
        const f = strength * (1 - d / radius) / d;
        p.vx += dx * f; p.vy += dy * f;
      }
    },

    update(dt) {
      this._acc = Math.min(this._acc + dt, 0.1);
      const step = 1 / 120;
      while (this._acc >= step) { this._acc -= step; this._step(); }
    },

    _step() {
      const K = 0.02, D = 0.975;   // spring constant / damping per substep
      for (const p of this.pts) {
        p.vx = (p.vx + (p.ox - p.x) * K) * D;
        p.vy = (p.vy + (p.oy - p.y) * K) * D;
        p.x += p.vx; p.y += p.vy;
      }
    },

    draw(c) {
      const { cols, rows, pts } = this;
      c.globalCompositeOperation = 'source-over';

      // base lattice — one path per direction
      c.strokeStyle = NV.PALETTE.grid;
      c.lineWidth = 1;
      c.beginPath();
      for (let r = 0; r < rows; r++) {
        const o = r * cols;
        c.moveTo(pts[o].x, pts[o].y);
        for (let i = 1; i < cols; i++) c.lineTo(pts[o + i].x, pts[o + i].y);
      }
      for (let col = 0; col < cols; col++) {
        c.moveTo(pts[col].x, pts[col].y);
        for (let i = 1; i < rows; i++) { const p = pts[i * cols + col]; c.lineTo(p.x, p.y); }
      }
      c.stroke();

      // energized segments — only where the lattice is displaced
      c.strokeStyle = NV.PALETTE.gridHot;
      c.lineWidth = 1.5;
      c.beginPath();
      const disp = (p) => Math.abs(p.x - p.ox) + Math.abs(p.y - p.oy);
      for (let r = 0; r < rows; r++) {
        const o = r * cols;
        for (let i = 0; i < cols - 1; i++) {
          const p = pts[o + i], q = pts[o + i + 1];
          if (disp(p) + disp(q) > 6) { c.moveTo(p.x, p.y); c.lineTo(q.x, q.y); }
        }
      }
      for (let col = 0; col < cols; col++) {
        for (let i = 0; i < rows - 1; i++) {
          const p = pts[i * cols + col], q = pts[(i + 1) * cols + col];
          if (disp(p) + disp(q) > 6) { c.moveTo(p.x, p.y); c.lineTo(q.x, q.y); }
        }
      }
      c.stroke();
    },
  };

  window.NV.Grid = Grid;
})();

/* ==== inlined: js/particles.js ==== */
'use strict';
/* ============================================================
   NEON VOID — particles.js
   Fully pooled particle system: glowing dots, velocity streaks,
   spinning outline shards (enemies shatter into their own
   geometry), expanding rings and floating score text.
   ============================================================ */
(function () {
  const { rand, TAU, clamp } = NV.U;

  const Fx = {
    parts: [], pool: [], texts: [],

    reset() { this.parts.length = 0; this.texts.length = 0; this.pool.length = 0; },

    _get() {
      if (this.parts.length >= NV.CONFIG.MAX_PARTICLES) return null;
      const p = this.pool.pop();
      if (p) { p.dead = false; return p; }
      return { x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 0, size: 0, color: '', type: '', drag: 0, rot: 0, vr: 0, width: 0, dead: false };
    },

    dot(x, y, color, opts = {}) {
      const p = this._get(); if (!p) return;
      const a = opts.a !== undefined ? opts.a : rand(TAU);
      const sp = opts.sp !== undefined ? opts.sp : rand(30, 240);
      p.type = 'dot'; p.x = x; p.y = y;
      p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
      p.life = p.max = opts.life || rand(0.3, 0.8);
      p.size = opts.size || rand(1.5, 3.5);
      p.color = color; p.drag = 2.2; p.rot = 0; p.vr = 0;
      this.parts.push(p);
    },

    /* A short streak flying in the given direction (muzzle flashes etc.). */
    spark(x, y, color, a, opts = {}) {
      const p = this._get(); if (!p) return;
      const sp = opts.sp !== undefined ? opts.sp : rand(200, 500);
      p.type = 'spark'; p.x = x; p.y = y;
      p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
      p.life = p.max = opts.life || 0.18;
      p.size = opts.size || 2.5;
      p.color = color; p.drag = 4; p.rot = 0; p.vr = 0;
      this.parts.push(p);
    },

    /* One segment of a dying shape's outline: flies outward from the
       death point, spinning, keeping its original length. */
    shard(x, y, ang, len, color, cx, cy) {
      const p = this._get(); if (!p) return;
      const dx = x - cx, dy = y - cy;
      const d = Math.hypot(dx, dy) || 1;
      const sp = rand(90, 320);
      p.type = 'shard'; p.x = x; p.y = y;
      p.vx = (dx / d) * sp + rand(-60, 60);
      p.vy = (dy / d) * sp + rand(-60, 60);
      p.life = p.max = rand(0.45, 0.9);
      p.size = len; p.color = color;
      p.rot = ang; p.vr = rand(-9, 9); p.drag = 1.6;

    /* Expanding ring (size = radius, rot doubles as expansion speed). */
    ring(x, y, color, r0, speed, life = 0.5, width = 2) {
      const p = this._get(); if (!p) return;
      p.type = 'ring'; p.x = x; p.y = y; p.vx = 0; p.vy = 0;
      p.life = p.max = life; p.size = r0; p.rot = speed; p.vr = 0;
      p.color = color; p.width = width; p.drag = 0;
      this.parts.push(p);
    },

    text(x, y, str, color, size = 15) {
      this.texts.push({ x, y, str, color, size, life: 1, max: 1, vy: -46, dead: false });
    },

    burst(x, y, color, n, sp = 260, opts = {}) {
      for (let i = 0; i < n; i++)
        this.dot(x, y, color, Object.assign({ sp: rand(sp * 0.25, sp) }, opts));
    },

    shatter(pts, color, cx, cy) {
      for (let i = 0; i < pts.length; i++) {

        const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
        if (len < 2) continue;

      }

<script>
/* ==== inlined: js/entities.js ==== */
'use strict';
/* ============================================================
   NEON VOID — entities.js
   The player ship, bullets, pickups and eight enemy archetypes,
   each with distinct steering AI:

     seeker    — relentless direct pursuit
     weaver    — sinusoidal curved approach
     drifter   — bounces around the arena, ignores you
     splitter  — slow tank; bursts into three fast minis
     dodger    — pursues, but actively flees your bullets
     sentinel  — keeps its distance and fires 3-round bursts
     pinwheel  — telegraphs, then dashes at your position
     well      — gravity well; drags you, your bullets and
                 everything else toward it; destabilizes if ignored

   Every enemy is a vector outline; on death the outline itself
   shatters into spinning shard particles.
   ============================================================ */
(function () {
  const U = NV.U, Fx = NV.Fx, Grid = NV.Grid, Render = NV.Render, A = NV.Audio;
  const T = NV.TUNE.player, PAL = NV.PALETTE;

  /* ------------------------------------------------------------------ */
  /* Enemy archetypes                                                     */
  /* ------------------------------------------------------------------ */
  const DEFS = {
    seeker:   { color: '#ff3ec8', r: 13, hp: 1,  score: 50,  cost: 1,   shape: U.poly(4, -Math.PI / 2), spin: 1.4, acc: 900,  maxV: 165 },
    weaver:   { color: '#31e5ff', r: 12, hp: 1,  score: 75,  cost: 1.5, shape: U.poly(3, -Math.PI / 2), acc: 1500, maxV: 245 },
    drifter:  { color: '#ffb020', r: 16, hp: 2,  score: 60,  cost: 1,   shape: U.poly(5), spin: 1.0, maxV: 95 },
    splitter: { color: '#ffe93c', r: 19, hp: 2,  score: 90,  cost: 2,   shape: U.poly(4, Math.PI / 4), spin: 1.8, acc: 420, maxV: 90 },
    mini:     { color: '#ffe93c', r: 9,  hp: 1,  score: 40,  cost: 0,   shape: U.poly(4, Math.PI / 4), spin: 3.2, acc: 1250, maxV: 240 },
    dodger:   { color: '#5cff5c', r: 12, hp: 1,  score: 120, cost: 2,   shape: [[1.15, 0], [-0.65, 0.85], [-0.25, 0], [-0.65, -0.85]], acc: 1400, maxV: 215 },
    sentinel: { color: '#b26cff', r: 15, hp: 3,  score: 150, cost: 3,   shape: U.poly(6), spin: 0.5, acc: 900, maxV: 170 },
    pinwheel: { color: '#ff5040', r: 14, hp: 2,  score: 130, cost: 2.5, shape: U.star(4, 0.42), spin: 7, maxV: 560 },
    well:     { color: '#8fd0ff', r: 21, hp: 10, score: 500, cost: 4,   shape: U.poly(10), spin: -0.4, maxV: 26 },
  };

  class Enemy {
    constructor(type, x, y, opts = {}) {
      const d = DEFS[type];

      this.x = x; this.y = y;
      this.vx = opts.vx || 0; this.vy = opts.vy || 0;
      this.r = d.r;

      this.t = U.rand(10); this.rot = U.rand(U.TAU);
      this.spin = (d.spin || 0) * (Math.random() < 0.5 ? -1 : 1) * (0.7 + Math.random() * 0.6);
      this.state = opts.instant ? 'active' : 'spawn';
      this.st = 0; this.flash = 0; this.dead = false; this.hitBy = 0;
      this.fireT = U.rand(1.2, 2.4); this.telegraph = 0;
      this.phase = 'wait'; this.phaseT = U.rand(0.5, 1.1); this.aimA = 0;
      this.wander = U.rand(U.TAU);
      if (type === 'well') this.fireT = 13;   // destabilization countdown
    }

    /* The enemy's outline in world space (used for drawing and shattering). */
    worldShape() {
      const d = this.def, cs = Math.cos(this.rot), sn = Math.sin(this.rot), r = this.r;
      return d.shape.map(p => [this.x + (p[0] * cs - p[1] * sn) * r, this.y + (p[0] * sn + p[1] * cs) * r]);
    }

    update(dt, g) {
      this.t += dt;
      this.flash = Math.max(0, this.flash - dt * 8);

      /* Attract-mode drift on the menu screen. */
      if (this.state === 'menu') {
        this.rot += this.spin * dt;
        this.x += this.vx * dt; this.y += this.vy * dt;
        this.confine(g, true);

      }

      const d = this.def, p = g.player;
      if (this.state === 'spawn') {           // harmless warp-in telegraph
        this.st += dt;
        if (this.st >= 0.55) this.state = 'active';
        return;
      }

      let ax = 0, ay = 0;
      const dx = p.x - this.x, dy = p.y - this.y;
      const dist = Math.hypot(dx, dy) || 1;
      const ux = dx / dist, uy = dy / dist;

      switch (this.type) {
        case 'seeker': case 'mini': case 'splitter':

          const a = Math.atan2(uy, ux) + Math.sin(this.t * 2.7) * 0.85;

          break;

        case 'drifter':
          if (!this.vx && !this.vy) {
            const a = U.rand(U.TAU);
            this.vx = Math.cos(a) * d.maxV; this.vy = Math.sin(a) * d.maxV;
          }
          this.rot += this.spin * dt;
          break;

        case 'dodger': {                       // bullet-aware evasion
          ax = ux * d.acc; ay = uy * d.acc;
          for (const b of g.bullets) {
            const bx = this.x - b.x, by = this.y - b.y, bd = Math.hypot(bx, by);
            if (bd < 170 && bd > 0.01) {
              const w = (1 - bd / 170) * 2600 / bd;
              ax += bx * w; ay += by * w;
            }

          const tang = Math.sin(this.t * 0.8) * 0.9;

          this.telegraph = this.fireT < 0.5 ? 1 - this.fireT / 0.5 : 0;
          if (this.fireT <= 0) {
            const base = Math.atan2(dy, dx);
            for (let i = -1; i <= 1; i++) g.spawnEBullet(this.x, this.y, base + i * 0.12, 330);
